      Object.assign(u, { user: r.user, top: r.top, recent: r.recent || [], history: r.history || null, fetchedAt: r.fetched_at });
      u.warn = r.stale ? staleNote(u, r.error, id) : null;
      local.set('u.' + id, { user: r.user, top: r.top, recent: r.recent, history: r.history || null, fetchedAt: r.fetched_at });
      clearMemo(id);
    } catch (e) {
      if (e.status === 401) { u.loading = false; return signedOut('signed_out'); }
      if (u.top) u.warn = explain(e, id).body;
      else u.error = explain(e, id);
    }
    u.loading = false;
    if (state.screen === 'app') render();
  }
  function ensureUser(id) {
    const u = hydrate(id);
    if (!u.loading && (!u.top || !u.fetchedAt || Date.now() - Date.parse(u.fetchedAt) > 10 * 60e3)) loadUser(id);
  }
  async function acceptInvite(code) {
    try {
      const r = await api('/friends', { method: 'POST', body: { code } });
      toast(`You and ${firstName(r.friend)} are now friends`);
    } catch (e) {
      if (e.status === 401) throw e;
      toast(e.code === 'own_invite' ? "That's your own invite link" : "That invite link isn't valid anymore");
    }
  }
  async function refreshMe() {
    setMe(await api('/me'));
  }
  async function loadBoard() {
    if (!state.me || !(state.me.friends || []).length) { state.board = null; updateLive(); return; }
    try {
      state.board = await api('/leaderboard?tz=' + encodeURIComponent(TZ));
      state.boardAt = Date.now();
      updateLive();
    } catch (e) {
      if (e.status === 401) signedOut('signed_out');
    }
  }
  async function startApp(me) {
    state.screen = 'app';
    state.fatal = null;
    if (me) setMe(me);
    else if (!state.me) state.me = local.get('me');
    if (state.me) hydrate(state.me.id);
    render();
    try {
      const pending = local.get('invite');
      if (pending) { local.del('invite'); await acceptInvite(pending); }
      await refreshMe();
    } catch (e) {
      if (e.status === 401) return signedOut('signed_out');
      if (!state.me) { state.fatal = explain(e, null); render(); return; }
    }
    render();
    loadBoard();
    await loadUser(state.me.id);
    pollNow();
  }

  let nowTimer = 0;
  async function pollNow() {
    clearTimeout(nowTimer);
    if (state.screen !== 'app' || !state.me) return;
    if (document.visibilityState === 'visible') {
      const ids = ['me', ...state.me.friends.map(f => f.id)];
      try {
        const r = await api('/now?users=' + ids.join(','));
        const sig = x => (x ? x.id + (x.playing ? '+' : '-') : '');
        let changed = false;
        for (const id of [state.me.id, ...state.me.friends.map(f => f.id)]) {
          const n = id in r ? r[id] : null;
          if (sig(n) !== sig(state.now[id])) { state.now[id] = n; changed = true; }
        }
        if (changed) updateLive();
      } catch (e) {
        if (e.status === 401) return signedOut('signed_out');
      }
    }
    nowTimer = setTimeout(pollNow, NOW_EVERY);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || state.screen !== 'app' || !state.me) return;
    pollNow();
    if (Date.now() - state.boardAt > 5 * 60e3) loadBoard();
  });

  /* ---------- Actions ---------- */
  async function withBusy(fn) {
    if (state.busy) return;
    state.busy = true;
    renderSheet();
    try { await fn(); } finally { state.busy = false; renderSheet(); }
  }
  const actions = {
    connect: () => connect(),
    back: () => history.back(),
    close: () => closeSheet(),
    retry: () => {
      if (state.fatal) return startApp(null);
      loadUser(subjectId());
    },
    refresh: () => withBusy(async () => {
      closeSheet();
      await refreshMe().catch(() => {});
      loadBoard();
      await loadUser(subjectId(), true);
      toast('Stats refreshed');
    }),
    logout: async () => {
      api('/logout', { method: 'POST' }).catch(() => {});
      signedOut(null);
    },
    delete: () => withBusy(async () => {
      try {
        await api('/account', { method: 'DELETE' });
        signedOut('deleted');
      } catch (e) {
        toast(e.status === 401 ? 'Your session ended. Log in again first.' : "Couldn't delete your account. Try again.");
      }
    }),
    remove: el => withBusy(async () => {
      const id = el.dataset.id;
      const name = firstName(friendOf(id));
      try {
        await api('/friends?id=' + encodeURIComponent(id), { method: 'DELETE' });
        await refreshMe().catch(() => {});
        loadBoard();
        delete state.users[id];
        local.del('u.' + id);
        toast(`Removed ${name}`);
        state.sheet = null;
        renderSheet();
        if (state.friend === id) history.go(history.state && history.state.sheet ? -2 : -1);
        else render();
      } catch (e) {
        toast("Couldn't remove them. Try again.");
      }
    }),
    copy: btn => {
      const text = (document.getElementById('invite-link') || {}).textContent || '';
      const done = () => { btn.textContent = 'Copied'; toast('Invite link copied'); setTimeout(() => { btn.textContent = 'Copy'; }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => selectLink());
      else selectLink();
    },
    share: () => {
      const url = (document.getElementById('invite-link') || {}).textContent || '';
      navigator.share({ title: 'Rotation', text: 'Compare your Spotify stats with me on Rotation', url }).catch(() => {});
    },
  };
  function selectLink() {
    const el = document.getElementById('invite-link');
    if (!el) return;
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  document.addEventListener('click', e => {
    if (e.target.classList && e.target.classList.contains('scrim')) { closeSheet(); return; }
    const el = e.target.closest('[data-range],[data-open],[data-list],[data-friend],[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.range) {
      if (el.dataset.range !== state.range) { state.range = el.dataset.range; local.set('range', state.range); render(); }
    } else if (el.dataset.open) openSheet(el.dataset.open);
    else if (el.dataset.list) openList(el.dataset.list);
    else if (el.dataset.friend) {
      if (state.sheet) { state.sheet = null; renderSheet(); history.replaceState({ friend: state.friend, list: state.list }, ''); }
      openFriend(el.dataset.friend);
    } else if (actions[el.dataset.act]) actions[el.dataset.act](el, e);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.sheet) closeSheet(); });
  window.addEventListener('scroll', syncBar, { passive: true });

  /* ---------- Start ---------- */
  async function boot() {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    const q = new URLSearchParams(location.search);
    const h = new URLSearchParams(location.hash.slice(1));
    const invite = (q.get('invite') || '').trim();
    if (invite) local.set('invite', invite);
    history.replaceState({}, '', invite || location.hash ? appUrl() : location.href);

    const ticket = h.get('ticket');
    const loginError = h.get('login_error');
    if (ticket) {
      const nonce = local.get('nonce');
      local.del('nonce');
      if (!nonce) return showGate('nonce_missing');
      state.screen = 'connecting';
      render();
      try {
        const r = await api('/auth/redeem', { method: 'POST', body: { ticket, nonce } });
        local.set('session', r.session);
        return startApp(r.me);
      } catch (e) {
        return showGate(e.code || 'error');
      }
    }
    if (loginError) {
      local.del('nonce');
      if (!local.get('session')) return showGate(loginError);
      startApp(null);
      toast(loginMessage(loginError));
      return;
    }
    if (local.get('session')) return startApp(null);
    showGate(null);
  }
  boot();
})();
</script>
</body>
</html>
