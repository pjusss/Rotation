<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src https://ohcfeqlcecvfxhnpmujr.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'">

<title>Rotation</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta property="og:title" content="Rotation">
<meta property="og:description" content="Top artists, tracks and listening time from Spotify, with your friends.">
<meta property="og:url" content="https://rotation-stats.vercel.app/">
<meta property="og:image" content="https://rotation-stats.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23131316'/%3E%3Ccircle cx='12' cy='12' r='7' fill='none' stroke='%23f3f2ee' stroke-width='2.4' stroke-dasharray='36 8' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='12' r='2.2' fill='%2322dd6a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{
  --ink:#131316;--raised:#1c1c21;--raised-2:#26262d;--line:#2b2b33;
  --text:#f3f2ee;--muted:#9a99a5;--faint:#62626d;
  --green:#22dd6a;--green-ink:#03210e;--down:#ff8a78;
  --tint:40 88 60;--tint-hi:120 226 160;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:16px;--maxw:760px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--ink)}
body{margin:0;min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;background:var(--ink);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:420;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:3px;border-radius:6px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* The page takes its color from the #1 artist of whoever you're looking at */
#tint{position:absolute;inset:0 0 auto;height:min(1000px,125vh);background-color:rgb(var(--tint));opacity:.6;-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 38%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 38%,transparent 100%);transition:background-color 1.1s ease;pointer-events:none}
#app{position:relative;z-index:1}

.wordmark{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-stretch:75%;font-size:23px;line-height:1;letter-spacing:.005em}
.mark{width:22px;height:22px;flex:none}
.mark .ring{fill:none;stroke:currentColor;stroke-width:2.6;stroke-dasharray:48 11;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 50%}
.mark .dot{fill:var(--green)}
body.loading .mark .ring{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Header */
.bar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);transition:background-color .25s ease,box-shadow .25s ease}
.bar.solid{background:rgba(19,19,22,.84);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);box-shadow:0 1px 0 var(--line)}
.bar-in{max-width:var(--maxw);margin:0 auto;padding:12px var(--gutter);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.bar-title{display:flex;align-items:center;gap:4px;min-width:0}
.back{display:grid;place-items:center;width:36px;height:36px;margin-left:-8px;border-radius:50%;flex:none}
.back svg{width:24px;height:24px}
.bar-h{margin:0;font-weight:800;font-stretch:75%;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--raised-2);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.mid{width:64px;height:64px;font-size:24px}
.avatar.big{width:72px;height:72px;font-size:28px}
.ranges{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:999px;background:rgba(255,255,255,.09)}
.ranges button{height:34px;border-radius:999px;text-align:center;font-size:14px;font-weight:600;color:rgba(243,242,238,.72);transition:background-color .2s ease,color .2s ease}
.ranges button[aria-selected="true"]{background:var(--text);color:var(--ink)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--gutter) calc(40px + env(safe-area-inset-bottom))}

/* Hero: #1 artist */
.hero{display:grid;margin:0 calc(var(--gutter) * -1)}
.hero>*{grid-area:1/1}
.hero.noimg{padding-top:56px}
.hero-img{margin:0;width:100%;aspect-ratio:1/1;max-height:min(64vh,540px);overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 100%);mask-image:linear-gradient(180deg,#000 50%,transparent 100%)}
.hero-img img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.hero-text{position:relative;align-self:end;min-width:0;padding:0 var(--gutter)}
.kicker{margin:0 0 8px;font-size:14px;font-weight:550;color:rgba(243,242,238,.84)}
.hero-name{margin:0;font-weight:900;font-stretch:62%;font-size:clamp(58px,17.5vw,124px);line-height:.86;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.hero-name button{display:block;width:100%;text-align:left;font:inherit;line-height:inherit;letter-spacing:inherit;text-wrap:balance;overflow-wrap:anywhere}
.hero-sub{margin:12px 0 0;font-size:14px;color:rgba(243,242,238,.72)}

/* Now playing */
.now{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;width:100%;margin-top:24px;padding:8px;border-radius:12px;background:rgba(255,255,255,.07)}
.now .art{width:48px;height:48px;border-radius:6px}
.now-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--green)}
.now-label.paused{color:var(--muted)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;flex:none}
.eq b{width:3px;height:3px;background:currentColor;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.4s}
.eq b:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

/* Sections */
.section{margin-top:44px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0;font-weight:800;font-stretch:72%;font-size:27px;line-height:1}
.see-all{padding:6px 0 6px 12px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.see-all:hover{color:var(--text)}

/* Friends */
.friends{display:flex;gap:16px;margin:0 calc(var(--gutter) * -1);padding:4px var(--gutter);list-style:none;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
.friends::-webkit-scrollbar{display:none}
.friend{display:flex;flex-direction:column;align-items:center;gap:8px;width:78px;text-align:center}
.friend .avatar.live{box-shadow:0 0 0 2.5px var(--ink),0 0 0 5px var(--green)}
.f-name{max-width:100%;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-now{display:flex;align-items:center;gap:4px;max-width:100%;margin-top:-4px;font-size:11.5px;font-weight:600;color:var(--green)}
.f-now span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invite-card{padding:20px;border-radius:16px;background:rgba(255,255,255,.06)}
.invite-card h2{margin:0 0 8px;font-weight:800;font-stretch:72%;font-size:27px;line-height:1}
.invite-card p{margin:0 0 16px;max-width:44ch;color:rgba(243,242,238,.84)}

/* Taste match */
.match-head{display:flex;align-items:center;gap:18px}
.pair{display:flex;flex:none}
.pair .avatar{width:56px;height:56px;font-size:22px;box-shadow:0 0 0 3px var(--ink)}
.pair .avatar+.avatar{margin-left:-16px}
.match-pct{font-weight:900;font-stretch:62%;font-size:92px;line-height:.82;font-variant-numeric:tabular-nums}
.match-sum{margin:14px 0 20px;max-width:44ch;color:rgba(243,242,238,.86)}
.match .s-h3{margin-top:22px}

/* Listening time */
.lt-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.lt-num{font-weight:900;font-stretch:62%;font-size:92px;line-height:.82;font-variant-numeric:tabular-nums}
.lt-label{font-size:15px;color:rgba(243,242,238,.8)}
.lt-delta{margin:14px 0 0;font-size:14px;font-weight:600}
.lt-delta.up{color:var(--green)}
.lt-delta.down{color:var(--down)}
.lt-stats{margin:18px 0 0}
.lt-stats strong{font-size:26px}
.lt-chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;align-items:end;height:128px;margin:22px 0 0}
.lt-col{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.lt-bar{display:block;width:100%;min-height:3px;border-radius:4px 4px 2px 2px;background:rgb(var(--tint-hi));opacity:.45;transition:background-color 1.1s ease}
.lt-col.today .lt-bar{opacity:1}
.lt-col.zero .lt-bar{background:rgba(255,255,255,.1);opacity:1}
.lt-day{font-size:11px;font-weight:600;line-height:1;color:var(--muted)}
.lt-col.today .lt-day{color:var(--text)}
.lt-sub{margin:30px 0 6px}
.lt-sub .s-h3{margin:0}
.lt-note{margin:16px 0 0;font-size:13px;color:var(--muted)}
.cnt{text-align:right;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rank-row.played{grid-template-columns:26px 44px minmax(0,1fr) auto}
.rank-row.played .art{width:44px;height:44px}
.rank-row.played .n{font-size:20px}

/* Weekly leaderboard */
.board{list-style:none;margin:0;padding:0}
.board-h{margin:26px 0 8px}
.board-row{display:grid;grid-template-columns:22px 40px minmax(0,1fr) auto;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:6px 8px;border-radius:10px;text-align:left}
.board-row .avatar{width:40px;height:40px}
.board-row .n{text-align:right;font-weight:850;font-stretch:62%;font-size:20px;color:var(--muted)}
.board-row .g-bar{margin-top:6px;height:4px}
button.board-row:active{background:rgba(255,255,255,.06)}

/* Swipeable top lists */
.rail{display:flex;gap:14px;margin:0 calc(var(--gutter) * -1);padding:0 var(--gutter) 4px;list-style:none;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:var(--gutter);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>li{flex:0 0 auto;width:136px;scroll-snap-align:start}
.rail.artists>li{width:116px}
.tile{display:block;width:100%}
.art{display:block;position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:6px;background:var(--raised-2)}
.art img{width:100%;height:100%;object-fit:cover}
.art.round{border-radius:50%}
.ph{display:block;width:100%;height:100%}
[data-open]:active .art{opacity:.75}
.tile-meta{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;margin-top:10px}
.tile-rank{grid-row:span 2;min-width:.55em;font-weight:850;font-stretch:62%;font-size:30px;line-height:.92;font-variant-numeric:tabular-nums}
.tile-meta.norank{display:block}
.t1,.t2{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t1{font-size:14px;font-weight:600;line-height:1.3}
.t2{font-size:13px;line-height:1.3;color:var(--muted)}
.rt{display:block;min-width:0}

/* Patterns */
.facts{list-style:none;margin:0;padding:0}
.fact{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0;padding-top:2px}
.fact-fig{font-weight:850;font-stretch:62%;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.fact-fig img{width:56px;height:56px;border-radius:50%;object-fit:cover}
.fact p{margin:0}

/* Genres */
.genres{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.genre{display:block;width:100%;padding:6px 0}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px}
.g-name{font-weight:600;overflow-wrap:anywhere}
.g-count{white-space:nowrap;font-size:13px;color:var(--muted)}
.g-bar{display:block;margin-top:7px;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
.g-bar i{display:block;height:100%;border-radius:3px;background:rgb(var(--tint-hi));transition:background-color 1.1s ease}

/* Listening clock */
.clock{display:flex;flex-direction:column;align-items:center;gap:14px}
.clock svg{width:min(270px,76vw);height:auto;overflow:visible}
.clock .off{fill:rgba(255,255,255,.07)}
.clock .on{fill:rgb(var(--tint-hi));opacity:.5;transition:fill 1.1s ease}
.clock .on.peak{opacity:1}
.clock text{fill:var(--muted);font-family:var(--font);font-size:10px;font-weight:600}
.clock .c-big{fill:var(--text);font-size:30px;font-weight:850;font-stretch:62%}
.clock-cap{margin:0;max-width:36ch;text-align:center;font-size:13px;color:var(--muted)}

/* Rows */
.rows,.rank-list{list-style:none;margin:0;padding:0}
.day{margin:20px 0 4px;font-size:13px;font-weight:650;color:var(--muted)}
.rows>.day:first-child{margin-top:0}
.row,.rank-row{display:grid;align-items:center;gap:12px;width:calc(100% + 16px);margin:0 -8px;padding:7px 8px;border-radius:10px}
.row{grid-template-columns:46px minmax(0,1fr) auto}
.row .art{width:46px;height:46px;border-radius:4px}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rank-row{grid-template-columns:30px 52px minmax(0,1fr) 40px}
.rank-row .art{width:52px;height:52px}
.rank-row .n{text-align:right;font-weight:850;font-stretch:62%;font-size:24px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-row .n.top{color:var(--text)}
.rank-row.mini{grid-template-columns:26px 44px minmax(0,1fr)}
.rank-row.mini .art{width:44px;height:44px}
.rank-row.mini .n{font-size:20px}
.row.plain{grid-template-columns:44px minmax(0,1fr)}
.row.plain .art{width:44px;height:44px}
.row:active,.rank-row:active,.genre:active{background:rgba(255,255,255,.06)}
@media (hover:hover){.row:hover,.rank-row:hover{background:rgba(255,255,255,.04)}}
.trend{text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.trend.up,.trend.new{color:var(--green)}
.trend.down{color:var(--down)}
.list-note{margin:6px 0 14px;font-size:13px;color:var(--muted)}
.list .section{margin-top:0}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--raised);border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.sheet:focus{outline:none}
.grab{width:38px;height:4px;margin:0 auto 18px;border-radius:2px;background:var(--faint)}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.x svg{width:18px;height:18px}
.s-head{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:end;margin:0 40px 20px 0}
.s-head .art{width:112px;height:112px}
.s-head.acct{grid-template-columns:72px minmax(0,1fr);align-items:center}
.s-head.solo{display:block}
.s-title{margin:0;font-weight:850;font-stretch:66%;font-size:32px;line-height:.95;overflow-wrap:anywhere}
.s-sub{margin:8px 0 0;font-size:14px;color:var(--muted)}
.s-label{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.ranks3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.ranks3>div{padding:12px;border-radius:12px;background:var(--raised-2)}
.ranks3>div.cur{box-shadow:inset 0 0 0 1.5px var(--text)}
.ranks3 span{display:block;font-size:12px;color:var(--muted)}
.ranks3 strong{display:block;margin-top:4px;font-weight:850;font-stretch:62%;font-size:28px;line-height:1}
.ranks3 strong.out{margin-top:8px;font-size:13px;font-weight:600;font-stretch:100%;line-height:1.2;color:var(--faint)}
.s-dl{margin:0 0 22px}
.s-dl>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.s-dl dt{color:var(--muted)}
.s-dl dd{margin:0;text-align:right;font-weight:550;overflow-wrap:anywhere}
.s-dl dd button{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.s-h3{margin:0 0 6px;font-size:15px;font-weight:700}
.s-h3 span{font-weight:450;color:var(--muted)}
.s-list{margin-bottom:22px}
.s-actions{display:grid;gap:10px;margin-bottom:8px}
@keyframes rise{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:700;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-green{background:var(--green);color:var(--green-ink)}
.btn-quiet{background:rgba(255,255,255,.09);color:var(--text)}
.btn-danger{background:rgba(255,138,120,.14);color:#ffb7aa}
.btn-block{display:flex;width:100%}
.btn-wide{min-width:240px}
.linkish{display:inline-block;margin-top:6px;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* Login */
.gate{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;padding:calc(18px + env(safe-area-inset-top)) var(--gutter) calc(24px + env(safe-area-inset-bottom))}
.gate-main{width:100%;margin:auto 0;padding:48px 0 24px}
.gate h1{margin:0 0 20px;font-weight:900;font-stretch:62%;font-size:clamp(68px,23vw,136px);line-height:.84;letter-spacing:-.01em}
.lede{margin:0 0 28px;max-width:34ch;font-size:17px;line-height:1.45;color:rgba(243,242,238,.86)}
.fine{margin:16px 0 0;max-width:46ch;font-size:13px;color:var(--muted)}
.fine a{color:inherit;text-underline-offset:3px}
.notice{margin:0 0 20px;padding:12px 14px;border-radius:12px;background:rgba(255,138,120,.12);color:#ffd5cd;font-size:14px}
.notice.calm{background:rgba(255,255,255,.07);color:rgba(243,242,238,.86)}
.inviter{display:flex;align-items:center;gap:12px;margin:0 0 28px;font-size:16px;line-height:1.35}
.inviter .avatar{width:48px;height:48px;font-size:19px}
.code{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--raised-2)}
.code code{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.copy{flex:none;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:650}

/* Loading, errors, toast, footer */
.sk{background:rgba(255,255,255,.07);border-radius:8px}
.sk-hero{height:min(56vh,420px);margin:0 calc(var(--gutter) * -1);border-radius:0;background:rgba(255,255,255,.035)}
.sk-name{position:relative;height:64px;width:72%;margin-top:-84px}
.sk-line{height:14px;width:40%;margin-top:14px}
.sk-rail{display:flex;gap:14px;margin-top:48px;overflow:hidden}
.sk-tile{flex:0 0 136px;height:136px;border-radius:6px}
@media (prefers-reduced-motion:no-preference){.sk{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.5}}
.error{margin-top:40px;padding:22px;border-radius:16px;background:var(--raised)}
.error h2{margin:0 0 10px;font-weight:850;font-stretch:66%;font-size:30px;line-height:1}
.error p{margin:0 0 10px;color:rgba(243,242,238,.86)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.warn{margin:18px 0 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13px;color:rgba(243,242,238,.86)}
#toast{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.toast{max-width:420px;padding:12px 18px;border-radius:999px;background:var(--text);color:var(--ink);font-size:14px;font-weight:650;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:rise .25s ease}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint)}
.foot p{margin:0;max-width:60ch}
.foot .btn{margin-bottom:22px}

@media (min-width:640px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:22px;max-height:84vh}
  .grab{display:none}
}
@media (min-width:720px){
  :root{--gutter:24px}
  .rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));row-gap:22px;overflow:visible}
  .rail>li,.rail.artists>li{width:auto}
  .rail>li:nth-child(n+11){display:none}
  .hero-img{-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 100%),linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(180deg,#000 50%,transparent 100%),linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-composite:intersect}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="tint" aria-hidden="true"></div>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>
<script>
(() => {
  'use strict';

  const API_BASE = 'https://ohcfeqlcecvfxhnpmujr.supabase.co/functions/v1/api';
  const RANGES = [
    { id: 'short_term', label: '4 weeks', adj: '4-week', long: 'the last 4 weeks' },
    { id: 'medium_term', label: '6 months', adj: '6-month', long: 'the last 6 months' },
    { id: 'long_term', label: '12 months', adj: '12-month', long: 'the last 12 months' },
  ];
  // Trend arrows compare each list with the next longer period.
  const COMPARE = { short_term: 'medium_term', medium_term: 'long_term' };
  const INK = [19, 19, 22];
  const DEFAULT_TINT = { bg: [40, 88, 60], hi: [120, 226, 160] };
  const NOW_EVERY = 60000;

  const root = document.documentElement;
  const app = document.getElementById('app');
  const sheetRoot = document.getElementById('sheet');
  const toastRoot = document.getElementById('toast');

  /* ---------- Browser storage (best effort) ---------- */
  const PREFIX = 'rotation.';
  const local = {
    get(k) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? null : JSON.parse(v); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(PREFIX + k); } catch {} },
    clear() { try { Object.keys(localStorage).filter(k => k.startsWith(PREFIX)).forEach(k => localStorage.removeItem(k)); } catch {} },
  };
  const appUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');

  /* ---------- Small helpers ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const names = arr => (arr || []).map(a => a.name).filter(Boolean).join(', ');
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const rangeOf = id => RANGES.find(r => r.id === id);
  const year = d => (d || '').slice(0, 4);
  const dur = ms => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const fmtTime = new Intl.DateTimeFormat('en', { hour: 'numeric', minute: '2-digit' });
  const fmtHour = new Intl.DateTimeFormat('en', { hour: 'numeric' });
  const fmtDay = new Intl.DateTimeFormat('en', { weekday: 'short', month: 'short', day: 'numeric' });
  const hourName = h => fmtHour.format(new Date(2000, 0, 1, h));
  // Day strings from the backend ("2026-11-01") are already in the viewer's time zone, so format them as UTC.
  const fmtWeekday = new Intl.DateTimeFormat('en', { weekday: 'narrow', timeZone: 'UTC' });
  const fmtDayUTC = new Intl.DateTimeFormat('en', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch { return 'UTC'; } })();
  function fmtDur(ms) {
    const m = Math.round((ms || 0) / 60000);
    if (m < 60) return `${m}m`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h}h ${r}m` : `${h}h`;
  }
  function dayLabel(d) {
    const a = new Date(d); a.setHours(0, 0, 0, 0);
    const b = new Date(); b.setHours(0, 0, 0, 0);
    const diff = Math.round((b - a) / 864e5);
    return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : fmtDay.format(new Date(d));
  }
  function parseRelease(s) {
    if (!s) return null;
    const [y, m = '01', d = '01'] = s.split('-');
    const t = Date.UTC(+y, +m - 1, +d);
    return Number.isNaN(t) ? null : t;
  }
  function randomString(n) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    return Array.from(crypto.getRandomValues(new Uint8Array(n)), b => chars[b % chars.length]).join('');
  }

  const MARK = '<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="9.4"/><circle class="dot" cx="12" cy="12" r="2.8"/></svg>';
  const CHEVRON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const EQ = '<i class="eq" aria-hidden="true"><b></b><b></b><b></b></i>';
  const img = url => url ? `<img src="${esc(url)}" alt="" loading="lazy" decoding="async">` : '<span class="ph" aria-hidden="true"></span>';
  const avatarInner = p => p && p.avatar ? `<img src="${esc(p.avatar)}" alt="">` : esc((p && p.name || '?').slice(0, 1).toUpperCase());

  /* ---------- Backend ---------- */
  class ApiError extends Error { constructor(status, code, message) { super(message || code); this.status = status; this.code = code; } }
  async function api(path, { method = 'GET', body } = {}) {
    const headers = {};
    const session = local.get('session');
    if (session) headers['x-session'] = session;
    if (body) headers['content-type'] = 'application/json';
    let res;
    try {
      res = await fetch(API_BASE + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    } catch {
      throw new ApiError(0, 'offline', "Couldn't reach Rotation.");
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new ApiError(res.status, data.error || 'error', data.message);
    return data;
  }

  /* ---------- State ---------- */
  const savedRange = local.get('range');
  const state = {
    screen: 'boot',
    gate: { err: null, busy: false, invite: null, config: null },
    me: null,
    users: {},
    now: {},
    friend: null, list: null, sheet: null,
    range: rangeOf(savedRange) ? savedRange : 'short_term',
    scroll: {},
    fatal: null,
    busy: false,
    board: null,
    boardAt: 0,
  };
  const isMe = id => !!state.me && id === state.me.id;
  const subjectId = () => state.friend || (state.me && state.me.id);
  const friendOf = id => (state.me && state.me.friends || []).find(f => f.id === id) || null;
  const profileOf = id => isMe(id) ? state.me : (friendOf(id) || (state.users[id] && state.users[id].user) || null);
  const firstName = p => ((p && p.name) || '').trim().split(/\s+/)[0] || 'Your friend';
  function who(id) {
    if (isMe(id)) return { name: 'You', poss: 'your', Poss: 'Your' };
    const n = firstName(profileOf(id));
    return { name: n, poss: `${n}'s`, Poss: `${n}'s` };
  }

  /* ---------- Stats worked out from the raw lists ---------- */
  const memo = new Map();
  function derived(id, range) {
    const key = id + '|' + range;
    if (memo.has(key)) return memo.get(key);
    const d = state.users[id] && state.users[id].top && state.users[id].top[range];
    if (!d) return null;
    const { artists, tracks } = d;

    const gm = new Map();
    artists.forEach((a, i) => {
      const w = artists.length - i;
      for (const g of a.genres || []) {
        const e = gm.get(g) || { name: g, weight: 0, count: 0 };
        e.weight += w; e.count += 1; gm.set(g, e);
      }
    });
    const genres = [...gm.values()].sort((a, b) => b.weight - a.weight || b.count - a.count);

    const am = new Map();
    tracks.forEach((t, i) => {
      let e = am.get(t.album.id);
      if (!e) { e = { ...t.album, weight: 0, count: 0 }; am.set(t.album.id, e); }
      e.weight += tracks.length - i; e.count += 1;
    });
    const albums = [...am.values()].sort((a, b) => b.weight - a.weight);

    const lead = new Set(tracks.map(t => t.artists[0] && t.artists[0].id).filter(Boolean));
    const credits = new Map();
    tracks.forEach(t => new Set(t.artists.map(a => a.id)).forEach(aid => credits.set(aid, (credits.get(aid) || 0) + 1)));
    let loyal = null;
    for (const [aid, count] of credits) if (!loyal || count > loyal.count) loyal = { id: aid, count };
    if (loyal) {
      const a = artists.find(x => x.id === loyal.id);
      loyal.name = a ? a.name : ((tracks.flatMap(t => t.artists).find(x => x.id === loyal.id) || {}).name || '');
      loyal.img = a ? a.sm : null;
    }
    const years = tracks.map(t => parseInt(year(t.album.date), 10)).filter(y => y > 1900).sort((a, b) => a - b);
    const medianYear = years.length ? years[Math.floor((years.length - 1) / 2)] : null;
    const now = Date.now();
    const fresh = tracks.filter(t => { const r = parseRelease(t.album.date); return r && r <= now && now - r <= 365 * 864e5; }).length;

    const out = { genres, albums, variety: lead.size, loyal, medianYear, fresh };
    memo.set(key, out);
    return out;
  }
  function clearMemo(id) { for (const k of [...memo.keys()]) if (k.startsWith(id + '|')) memo.delete(k); }
  function listFor(id, kind, range) {
    const d = state.users[id] && state.users[id].top && state.users[id].top[range];
    if (!d) return null;
    if (kind === 'tracks') return d.tracks;
    if (kind === 'artists') return d.artists;
    return (derived(id, range) || {}).albums || null;
  }
  const indexIn = (list, itemId) => { const i = list ? list.findIndex(x => x.id === itemId) : -1; return i >= 0 ? i + 1 : 0; };

  // How alike two people's top lists are, 0 to 100.
  function match(aId, bId, range) {
    const A = state.users[aId] && state.users[aId].top && state.users[aId].top[range];
    const B = state.users[bId] && state.users[bId].top && state.users[bId].top[range];
    if (!A || !B) return null;
    const weights = list => new Map(list.map((x, i) => [x.id, list.length - i]));
    const cos = (m1, m2) => {
      let dot = 0, n1 = 0, n2 = 0;
      for (const [k, v] of m1) { n1 += v * v; const w = m2.get(k); if (w) dot += v * w; }
      for (const v of m2.values()) n2 += v * v;
      return n1 && n2 ? dot / Math.sqrt(n1 * n2) : 0;
    };
    const gA = new Map(derived(aId, range).genres.map(g => [g.name, g.weight]));
    const gB = new Map(derived(bId, range).genres.map(g => [g.name, g.weight]));
    const parts = [[0.45, weights(A.artists), weights(B.artists)], [0.4, gA, gB], [0.15, weights(A.tracks), weights(B.tracks)]]
      .filter(([, x, y]) => x.size && y.size);
    const total = parts.reduce((s, [w]) => s + w, 0);
    const score = total ? parts.reduce((s, [w, x, y]) => s + w * cos(x, y), 0) / total : 0;
    const shared = (la, lb) => {
      const rb = new Map(lb.map((x, i) => [x.id, i + 1]));
      return la.map((x, i) => ({ item: x, a: i + 1, b: rb.get(x.id) })).filter(x => x.b).sort((p, q) => (p.a + p.b) - (q.a + q.b));
    };
    return { pct: Math.round(score * 100), artists: shared(A.artists, B.artists), tracks: shared(A.tracks, B.tracks), genres: [...gA.keys()].filter(g => gB.has(g)) };
  }

  /* ---------- Artwork color ---------- */
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    const l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h /= 6;
    }
    return [h, s, l];
  }
  function hslToRgb(h, s, l) {
    const f = n => { const k = (n + h * 12) % 12; const a = s * Math.min(l, 1 - l); return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
    return [f(0), f(8), f(4)];
  }
  const colorCache = new Map();
  function artColor(url) {
    if (!colorCache.has(url)) colorCache.set(url, new Promise(resolve => {
      const im = new Image();
      im.crossOrigin = 'anonymous';
      im.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = c.height = 36;
          const x = c.getContext('2d', { willReadFrequently: true });
          x.drawImage(im, 0, 0, 36, 36);
          const d = x.getImageData(0, 0, 36, 36).data;
          // Bucket pixels by hue, favouring vivid ones, and take the strongest bucket.
          const buckets = Array.from({ length: 13 }, () => ({ w: 0, r: 0, g: 0, b: 0 }));
          for (let i = 0; i < d.length; i += 4) {
            const [h, s, l] = rgbToHsl(d[i], d[i + 1], d[i + 2]);
            const vivid = s * (1 - Math.abs(l - 0.5) * 1.6);
            const k = vivid < 0.12 ? 12 : Math.floor(h * 12) % 12;
            const w = k === 12 ? 0.25 : vivid + 0.05;
            const bk = buckets[k];
            bk.w += w; bk.r += d[i] * w; bk.g += d[i + 1] * w; bk.b += d[i + 2] * w;
          }
          const best = buckets.slice(0, 12).reduce((a, b) => (b.w > a.w ? b : a));
          const pick = best.w > buckets[12].w * 0.35 ? best : buckets[12];
          resolve(pick.w ? [pick.r / pick.w, pick.g / pick.w, pick.b / pick.w] : null);
        } catch { resolve(null); }
      };
      im.onerror = () => resolve(null);
      im.src = url;
    }));
    return colorCache.get(url);
  }
  function tintFromRgb([r, g, b]) {
    const [h, s] = rgbToHsl(r, g, b);
    if (s < 0.12) return { bg: [70, 70, 80], hi: [196, 196, 206] };
    return { bg: hslToRgb(h, Math.min(Math.max(s, 0.4), 0.7), 0.36), hi: hslToRgb(h, Math.min(Math.max(s, 0.5), 0.85), 0.68) };
  }
  function setTint(t) {
    root.style.setProperty('--tint', t.bg.join(' '));
    root.style.setProperty('--tint-hi', t.hi.join(' '));
    const top = t.bg.map((c, i) => Math.round(c * 0.6 + INK[i] * 0.4));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', `rgb(${top.join(',')})`);
  }
  let tintFor;
  async function applyTint() {
    const id = state.screen === 'app' ? subjectId() : null;
    const d = id && state.users[id] && state.users[id].top && state.users[id].top[state.range];
    const url = d ? ((d.artists[0] && d.artists[0].md) || (d.tracks[0] && d.tracks[0].album.md) || null) : null;
    if (url === tintFor) return;
    tintFor = url;
    const rgb = url ? await artColor(url) : null;
    if (tintFor !== url) return;
    setTint(rgb ? tintFromRgb(rgb) : DEFAULT_TINT);
  }

  /* ---------- Shared bits of the stats pages ---------- */
  function header(title) {
    const ranges = state.list === 'recent' || state.list === 'played' ? '' : `<div class="ranges" role="tablist" aria-label="Time period">${RANGES.map(r => `<button role="tab" data-range="${r.id}" aria-selected="${r.id === state.range}">${r.label}</button>`).join('')}</div>`;
    return `<header class="bar" id="bar"><div class="bar-in">
      <div class="bar-title">${title != null ? `<button class="back" data-act="back" aria-label="Back">${CHEVRON}</button><h1 class="bar-h">${esc(title)}</h1>` : `<span class="wordmark">${MARK}rotation</span>`}</div>
      <button class="avatar" data-open="account:me" aria-label="Your account">${avatarInner(state.me)}</button>
      ${ranges}
    </div></header>`;
  }
  function skeletonView() {
    return `<div class="sk sk-hero"></div><div class="sk sk-name"></div><div class="sk sk-line"></div><div class="sk-rail">${'<div class="sk sk-tile"></div>'.repeat(4)}</div>`;
  }
  function errorView(e) {
    const action = e.action === 'reconnect'
      ? '<button class="btn btn-green" data-act="connect">Connect Spotify again</button>'
      : '<button class="btn btn-green" data-act="retry">Try again</button>';
    return `<div class="error" role="alert"><h2>${esc(e.title)}</h2><p>${esc(e.body)}</p><div class="actions">${action}${e.back ? '<button class="btn btn-quiet" data-act="back">Back</button>' : ''}</div></div>`;
  }
  function footView(u) {
    const when = u && u.fetchedAt ? `Updated ${fmtTime.format(new Date(u.fetchedAt))}${dayLabel(u.fetchedAt) === 'Today' ? '' : ', ' + fmtDay.format(new Date(u.fetchedAt))}. ` : '';
    return `<footer class="foot"><p>${when}Data from Spotify. Rankings are Spotify's own top items for each period.</p></footer>`;
  }

  function heroView(id, d, r) {
    const a = d.artists[0];
    const w = who(id);
    if (!a) return `<section class="hero noimg"><div class="hero-text"><p class="kicker">Not enough listening in ${r.long} yet. Try a longer period.</p></div></section>`;
    return `<section class="hero${a.lg ? '' : ' noimg'}">
      ${a.lg ? `<figure class="hero-img"><img src="${esc(a.lg)}" alt="" decoding="async" fetchpriority="high"></figure>` : ''}
      <div class="hero-text">
        <p class="kicker">${esc(w.Poss)} top artist over ${r.long}</p>
        <h2 class="hero-name"><button data-open="artist:${esc(a.id)}">${esc(a.name)}</button></h2>
        ${a.genres.length ? `<p class="hero-sub">${esc(a.genres.slice(0, 3).join(', '))}</p>` : ''}
      </div>
    </section>`;
  }

  function nowView(id) {
    const n = state.now[id];
    if (!n) return '';
    const label = n.playing
      ? `<span class="now-label">${EQ}${isMe(id) ? 'Playing now' : esc(who(id).name) + ' is listening'}</span>`
      : '<span class="now-label paused">Paused</span>';
    return `<button class="now" data-open="track:${esc(n.id)}"><span class="art">${img(n.album.sm)}</span><span class="rt">${label}<span class="t1">${esc(n.name)}</span><span class="t2">${esc(names(n.artists))}</span></span></button>`;
  }

  function friendsView() {
    const fr = (state.me && state.me.friends) || [];
    if (!fr.length) {
      return `<section class="section"><div class="invite-card"><h2>Friends</h2><p>Add friends to see their top artists and tracks, what they're playing right now, and how your taste compares.</p><button class="btn btn-quiet" data-open="invite:me">Invite friends</button></div></section>`;
    }
    return `<section class="section"><div class="sec-head"><h2>Friends</h2><button class="see-all" data-open="invite:me">Invite</button></div>
      <ul class="friends" aria-label="Friends">${fr.map(f => {
        const n = state.now[f.id];
        const live = !!(n && n.playing);
        const label = `${f.name}${live ? `, listening to ${n.name}` : ''}`;
        return `<li><button class="friend" data-friend="${esc(f.id)}" aria-label="${esc(label)}"><span class="avatar mid${live ? ' live' : ''}">${avatarInner(f)}</span><span class="f-name">${esc(firstName(f))}</span>${live ? `<span class="f-now">${EQ}<span>${esc(n.name)}</span></span>` : ''}</button></li>`;
      }).join('')}</ul>${boardView()}</section>`;
  }

  // Listening time over the last 7 days for you and your friends.
  function boardView() {
    const b = state.board;
    if (!b || b.length < 2 || !b.some(x => x.ms > 0)) return '';
    const max = Math.max(1, ...b.map(x => x.ms));
    const rows = b.map((x, i) => {
      const mine = isMe(x.id);
      const p = mine ? state.me : friendOf(x.id);
      if (!p) return '';
      const inner = `<span class="n">${i + 1}</span><span class="avatar">${avatarInner(p)}</span><span class="rt"><span class="t1">${esc(mine ? 'You' : firstName(p))}</span><span class="g-bar"><i style="width:${Math.max(2, (x.ms / max) * 100).toFixed(1)}%"></i></span></span><span class="cnt">${fmtDur(x.ms)}</span>`;
      return `<li>${mine ? `<div class="board-row">${inner}</div>` : `<button class="board-row" data-friend="${esc(x.id)}">${inner}</button>`}</li>`;
    }).join('');
    return `<h3 class="s-h3 board-h">Listening time this week</h3><ol class="board">${rows}</ol>`;
  }

  function listenView(id) {
    const u = state.users[id];
    const h = u && u.history;
    if (!h) return '';
    const w = who(id);
    const head = '<div class="sec-head"><h2>Listening time</h2></div>';
    if (!h.total_plays) {
      return `<section class="section">${head}<p class="muted">Rotation just started logging ${esc(w.poss)} plays. Listening time shows up here after the next few songs.</p></section>`;
    }
    const delta = h.week_ms - h.prev_week_ms;
    const deltaHtml = h.prev_week_ms > 0
      ? `<p class="lt-delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${fmtDur(Math.abs(delta))} ${delta >= 0 ? 'more' : 'less'} than the week before</p>`
      : '';
    const days = h.days || [];
    const max = Math.max(1, ...days.map(x => x.ms));
    const chart = days.length ? `<div class="lt-chart" role="img" aria-label="Listening time per day over the last two weeks">${days.map((x, i) => {
      const dt = new Date(x.d + 'T12:00:00Z');
      const today = i === days.length - 1;
      return `<div class="lt-col${today ? ' today' : ''}${x.ms ? '' : ' zero'}" title="${esc(fmtDayUTC.format(dt))}: ${fmtDur(x.ms)}"><span class="lt-bar" style="height:${x.ms ? (6 + (74 * x.ms) / max).toFixed(1) : 2}%"></span><span class="lt-day">${fmtWeekday.format(dt)}</span></div>`;
    }).join('')}</div>` : '';
    const all = h.top_tracks || [];
    const top = all.slice(0, 5);
    const more = all.length > 5 || (h.top_artists || []).length > 0;
    return `<section class="section">${head}
      <div class="lt-big"><span class="lt-num">${fmtDur(h.week_ms)}</span><span class="lt-label">in the last 7 days</span></div>
      ${deltaHtml}
      <div class="ranks3 lt-stats"><div><span>Today</span><strong>${fmtDur(h.today_ms)}</strong></div><div><span>Streak</span><strong>${plural(h.streak, 'day', 'days')}</strong></div><div><span>Plays this week</span><strong>${h.week_plays}</strong></div></div>
      ${chart}
      ${top.length ? `<div class="sec-head lt-sub"><h3 class="s-h3">Most played this week</h3>${more ? '<button class="see-all" data-list="played">See all</button>' : ''}</div><ol class="rank-list">${top.map((x, i) => playedRow(x, i + 1)).join('')}</ol>` : ''}
      <p class="lt-note">Counting since ${esc(fmtDay.format(new Date(h.since)))}. Minutes are estimated from when each song ended.</p>
    </section>`;
  }
  function playedRow(x, rank) {
    const t = x.track || {};
    return `<li><button class="rank-row played" data-open="track:${esc(t.id)}"><span class="n${rank <= 3 ? ' top' : ''}">${rank}</span><span class="art">${img(t.album && t.album.sm)}</span><span class="rt"><span class="t1">${esc(t.name)}</span><span class="t2">${esc(names(t.artists))}</span></span><span class="cnt">${plural(x.plays, 'play', 'plays')}</span></button></li>`;
  }
  function artistTimeRow(sid, a, rank) {
    const known = findArtist(sid, a.id);
    return `<li><button class="rank-row played" data-open="artist:${esc(a.id)}"><span class="n${rank <= 3 ? ' top' : ''}">${rank}</span><span class="art round">${img(known && known.sm)}</span><span class="rt"><span class="t1">${esc(a.name)}</span><span class="t2">${plural(a.plays, 'play', 'plays')}</span></span><span class="cnt">${fmtDur(a.ms)}</span></button></li>`;
  }

  function decadesView(id, d) {
    const years = d.tracks.map(t => parseInt(year(t.album.date), 10)).filter(y => y > 1900);
    if (years.length < 5) return '';
    const m = new Map();
    years.forEach(y => { const k = Math.floor(y / 10) * 10; m.set(k, (m.get(k) || 0) + 1); });
    const rows = [...m.entries()].sort((a, b) => b[0] - a[0]);
    const max = Math.max(...m.values());
    return `<section class="section"><div class="sec-head"><h2>Decades</h2></div><ol class="genres">${rows.map(([dec, n]) => `<li><div class="genre"><span class="g-top"><span class="g-name">${dec}s</span><span class="g-count">${Math.round((n * 100) / years.length)}%</span></span><span class="g-bar"><i style="width:${((n / max) * 100).toFixed(1)}%"></i></span></div></li>`).join('')}</ol>
      <p class="lt-note">Release years of ${esc(who(id).poss)} top ${years.length} tracks over ${rangeOf(state.range).long}.</p></section>`;
  }

  function matchView(id, r) {
    const m = match(state.me.id, id, state.range);
    if (!m) return '';
    const name = who(id).name;
    const k = m.artists.length, g = m.genres.length;
    const sum = k
      ? `${plural(k, 'artist', 'artists')} and ${plural(g, 'genre', 'genres')} are in both your top lists over ${r.long}.`
      : g ? `None of your top artists overlap over ${r.long}, but ${plural(g, 'genre', 'genres')} do.`
        : `Nothing in common over ${r.long} yet. Try a longer period.`;
    const rankText = x => `You #${x.a}, ${name} #${x.b}`;
    return `<section class="section match"><div class="sec-head"><h2>Taste match</h2></div>
      <div class="match-head"><span class="pair"><span class="avatar">${avatarInner(state.me)}</span><span class="avatar">${avatarInner(profileOf(id))}</span></span><span class="match-pct">${m.pct}%</span></div>
      <p class="match-sum">${esc(sum)}</p>
      ${k ? `<h3 class="s-h3">Artists you share</h3><ol class="rail artists" aria-label="Artists you share">${m.artists.slice(0, 12).map(x => tileView(`artist:${x.item.id}`, x.item.md, null, x.item.name, rankText(x), true)).join('')}</ol>` : ''}
      ${m.tracks.length ? `<h3 class="s-h3">Tracks you share</h3><ul class="rows">${m.tracks.slice(0, 5).map(x => `<li><button class="row plain" data-open="track:${esc(x.item.id)}"><span class="art">${img(x.item.album.sm)}</span><span class="rt"><span class="t1">${esc(x.item.name)}</span><span class="t2">${esc(rankText(x))}</span></span></button></li>`).join('')}</ul>` : ''}
    </section>`;
  }

  function railView(title, kind, total, tiles, cls = '') {
    return `<section class="section">
      <div class="sec-head"><h2>${title}</h2>${total ? `<button class="see-all" data-list="${kind}">See all ${total}</button>` : ''}</div>
      ${tiles.length ? `<ol class="rail ${cls}" aria-label="${title}">${tiles.join('')}</ol>` : '<p class="muted">Nothing here for this period yet.</p>'}
    </section>`;
  }
  function tileView(key, url, rank, t1, t2, round) {
    return `<li><button class="tile" data-open="${esc(key)}"><span class="art${round ? ' round' : ''}">${img(url)}</span><span class="tile-meta${rank == null ? ' norank' : ''}">${rank == null ? '' : `<span class="tile-rank">${rank}</span>`}<span class="t1">${esc(t1)}</span>${t2 ? `<span class="t2">${esc(t2)}</span>` : ''}</span></button></li>`;
  }

  function factsView(id, d, x) {
    const n = d.tracks.length;
    if (n < 5) return '';
    const p = who(id).poss;
    const rows = [`<li class="fact"><span class="fact-fig">${x.variety}</span><p>different artists lead ${esc(p)} top ${n} tracks.</p></li>`];
    if (x.loyal && x.loyal.count > 1 && x.loyal.name) {
      rows.push(`<li class="fact"><span class="fact-fig">${x.loyal.img ? `<img src="${esc(x.loyal.img)}" alt="">` : x.loyal.count}</span><p>${esc(x.loyal.name)} is on ${x.loyal.count} of ${esc(p)} top ${n} tracks.</p></li>`);
    }
    if (x.medianYear) {
      const fresh = x.fresh ? ` ${x.fresh === 1 ? 'One' : x.fresh} came out in the past 12 months.` : '';
      rows.push(`<li class="fact"><span class="fact-fig">${x.medianYear}</span><p>is the median release year of ${esc(p)} top tracks.${fresh}</p></li>`);
    }
    return `<section class="section"><div class="sec-head"><h2>Patterns</h2></div><ul class="facts">${rows.join('')}</ul></section>`;
  }

  function genresView(id, genres, all) {
    const head = all ? '' : `<div class="sec-head"><h2>Top genres</h2>${genres.length > 6 ? `<button class="see-all" data-list="genres">See all ${genres.length}</button>` : ''}</div>`;
    if (!genres.length) return `<section class="section">${head}<p class="muted">Spotify hasn't tagged genres on ${esc(who(id).poss)} top artists for this period.</p></section>`;
    const list = all ? genres : genres.slice(0, 6);
    const max = genres[0].weight;
    return `<section class="section">${head}<ol class="genres">${list.map(g => `<li><button class="genre" data-open="genre:${esc(g.name)}"><span class="g-top"><span class="g-name">${esc(g.name)}</span><span class="g-count">${plural(g.count, 'artist', 'artists')}</span></span><span class="g-bar"><i style="width:${Math.max(3, (g.weight / max) * 100).toFixed(1)}%"></i></span></button></li>`).join('')}</ol></section>`;
  }

  function clockView(id) {
    const u = state.users[id] || {};
    const h = u.history;
    const plays = u.recent || [];
    let counts, caption;
    if (h && h.hours_plays >= 50 && Array.isArray(h.hours) && h.hours.length === 24) {
      counts = h.hours.map(Number);
      caption = `When ${esc(who(id).poss)} ${h.hours_plays} logged plays over the last 4 weeks happened.`;
    } else {
      if (plays.length < 8) return '';
      counts = Array(24).fill(0);
      plays.forEach(p => { counts[new Date(p.at).getHours()] += 1; });
      const oldest = plays[plays.length - 1].at;
      const since = dayLabel(oldest) === 'Today' ? 'earlier today' : dayLabel(oldest) === 'Yesterday' ? 'yesterday' : fmtDay.format(new Date(oldest));
      caption = `When ${esc(who(id).poss)} last ${plays.length} plays happened, going back to ${since}. It switches to weeks of history once Rotation has logged more plays.`;
    }
    const max = Math.max(...counts);
    const peak = counts.indexOf(max);
    const S = 240, C = S / 2, R0 = 42, R1 = 98, gap = 0.035;
    const arc = (ri, ro, a0, a1) => {
      const pt = (rr, a) => `${(C + rr * Math.cos(a)).toFixed(2)} ${(C + rr * Math.sin(a)).toFixed(2)}`;
      return `M${pt(ri, a0)}L${pt(ro, a0)}A${ro} ${ro} 0 0 1 ${pt(ro, a1)}L${pt(ri, a1)}A${ri} ${ri} 0 0 0 ${pt(ri, a0)}Z`;
    };
    const bars = counts.map((n, h) => {
      const a0 = (h / 24) * 2 * Math.PI - Math.PI / 2 + gap;
      const a1 = ((h + 1) / 24) * 2 * Math.PI - Math.PI / 2 - gap;
      const ro = n ? R0 + 6 + ((R1 - R0 - 6) * n) / max : R0 + 3;
      return `<path class="${n ? 'on' : 'off'}${n && h === peak ? ' peak' : ''}" d="${arc(R0, ro, a0, a1)}"><title>${hourName(h)}: ${plural(n, 'play', 'plays')}</title></path>`;
    }).join('');
    const labels = [[0, '12 AM'], [6, '6 AM'], [12, '12 PM'], [18, '6 PM']].map(([h, t]) => {
      const a = (h / 24) * 2 * Math.PI - Math.PI / 2, rr = R1 + 14;
      return `<text x="${(C + rr * Math.cos(a)).toFixed(1)}" y="${(C + rr * Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${t}</text>`;
    }).join('');
    return `<section class="section"><div class="sec-head"><h2>Listening clock</h2></div><div class="clock">
      <svg viewBox="-14 -14 ${S + 28} ${S + 28}" role="img" aria-label="Plays by hour of day. Most plays around ${hourName(peak)}.">${bars}${labels}
        <text x="${C}" y="${C - 15}" text-anchor="middle">Peak</text>
        <text class="c-big" x="${C}" y="${C + 13}" text-anchor="middle">${hourName(peak)}</text>
      </svg>
      <p class="clock-cap">${caption}</p>
    </div></section>`;
  }

  function recentView(id, all) {
    const plays = (state.users[id] && state.users[id].recent) || [];
    if (!plays.length) return all ? '<p class="muted">No recent plays yet.</p>' : '';
    const list = all ? plays : plays.slice(0, 6);
    let html = '', last = '';
    for (const p of list) {
      const day = dayLabel(p.at);
      if (day !== last) { html += `<li class="day">${esc(day)}</li>`; last = day; }
      html += `<li><button class="row" data-open="track:${esc(p.id)}"><span class="art">${img(p.album.sm)}</span><span class="rt"><span class="t1">${esc(p.name)}</span><span class="t2">${esc(names(p.artists))}</span></span><span class="time">${fmtTime.format(new Date(p.at))}</span></button></li>`;
    }
    const head = all ? '' : `<div class="sec-head"><h2>Recently played</h2><button class="see-all" data-list="recent">See all ${plays.length}</button></div>`;
    return `<section class="section">${head}<ul class="rows">${html}</ul></section>`;
  }

  function trendView(t) {
    if (t == null || t === 0) return '<span class="trend"></span>';
    if (t === 'new') return '<span class="trend new">New</span>';
    return t > 0 ? `<span class="trend up"><span class="sr">Up </span>▲${t}</span>` : `<span class="trend down"><span class="sr">Down </span>▼${-t}</span>`;
  }

  /* ---------- Pages ---------- */
  function pageView() {
    const id = subjectId();
    const mine = isMe(id);
    const u = state.users[id];
    const title = mine ? null : ((profileOf(id) || {}).name || '');
    if (state.fatal) return header(title) + `<main class="wrap">${errorView(state.fatal)}</main>`;
    if (!u || !u.top) {
      return header(state.list ? listTitle(id) : title) + `<main class="wrap">${u && u.error ? errorView(u.error) : skeletonView()}</main>`;
    }
    if (state.list) return header(listTitle(id)) + `<main class="wrap list">${u.warn ? warnView(u.warn) : ''}${listBody(id)}${footView(u)}</main>`;
    const r = rangeOf(state.range);
    const d = u.top[state.range];
    const x = derived(id, state.range);
    return header(title) + `<main class="wrap">
      <h1 class="sr">${mine ? 'Your Spotify stats' : esc(who(id).Poss) + ' Spotify stats'}</h1>
      ${u.warn ? warnView(u.warn) : ''}
      ${heroView(id, d, r)}
      <div id="now-slot">${nowView(id)}</div>
      ${mine ? `<div id="friends-slot">${friendsView()}</div>` : matchView(id, r)}
      ${listenView(id)}
      ${railView('Top tracks', 'tracks', d.tracks.length, d.tracks.slice(0, 12).map((t, i) => tileView(`track:${t.id}`, t.album.md, i + 1, t.name, names(t.artists))))}
      ${railView('Top artists', 'artists', d.artists.length, d.artists.slice(0, 12).map((a, i) => tileView(`artist:${a.id}`, a.md, i + 1, a.name, '', true)), 'artists')}
      ${railView('Top albums', 'albums', x.albums.length, x.albums.slice(0, 12).map((al, i) => tileView(`album:${al.id}`, al.md, i + 1, al.name, al.artists.join(', '))))}
      ${factsView(id, d, x)}
      ${genresView(id, x.genres, false)}
      ${decadesView(id, d)}
      ${clockView(id)}
      ${recentView(id, false)}
      ${mine ? '' : `<section class="section"><button class="btn btn-quiet" data-open="remove:${esc(id)}">Remove ${esc(who(id).name)} from friends</button></section>`}
      ${footView(u)}
    </main>`;
  }

  function warnView(w) { return `<p class="warn" role="status">${esc(w)}</p>`; }
  function listTitle(id) {
    const base = { tracks: 'top tracks', artists: 'top artists', albums: 'top albums', genres: 'top genres', recent: 'recently played', played: 'most played' }[state.list];
    if (isMe(id)) return base.charAt(0).toUpperCase() + base.slice(1);
    return state.list === 'recent' ? `${who(id).name}, recently played` : `${who(id).Poss} ${base}`;
  }
  function listBody(id) {
    const kind = state.list;
    const u = state.users[id];
    const d = u.top[state.range];
    const r = rangeOf(state.range);
    const w = who(id);
    if (kind === 'played') {
      const h = u.history || {};
      const tracks = h.top_tracks || [];
      const artists = h.top_artists || [];
      if (!tracks.length) return '<p class="muted">No plays logged in the last 7 days yet.</p>';
      return `<p class="list-note">The last 7 days, from the plays Rotation has logged${h.since ? ` since ${esc(fmtDay.format(new Date(h.since)))}` : ''}.</p>
        <ol class="rank-list">${tracks.map((x, i) => playedRow(x, i + 1)).join('')}</ol>
        ${artists.length ? `<div class="sec-head lt-sub"><h3 class="s-h3">Artists by listening time</h3></div><ol class="rank-list">${artists.map((a, i) => artistTimeRow(id, a, i + 1)).join('')}</ol>` : ''}`;
    }
    if (kind === 'recent') return `<p class="list-note">Spotify shares the ${plural(u.recent.length, 'most recent play', 'most recent plays')}.</p>` + recentView(id, true);
    if (kind === 'genres') return `<p class="list-note">From the genres Spotify tags on ${esc(w.poss)} top ${d.artists.length} artists over ${r.long}, weighted by rank.</p>` + genresView(id, derived(id, state.range).genres, true);
    const cmp = COMPARE[state.range];
    const prevList = cmp ? listFor(id, kind, cmp) : null;
    const prev = prevList ? new Map(prevList.map((x, i) => [x.id, i])) : null;
    const items = kind === 'tracks'
      ? d.tracks.map(t => ({ key: `track:${t.id}`, id: t.id, url: t.album.sm, t1: t.name, t2: names(t.artists) }))
      : kind === 'artists'
        ? d.artists.map(a => ({ key: `artist:${a.id}`, id: a.id, url: a.sm, t1: a.name, t2: a.genres.slice(0, 2).join(', '), round: true }))
        : derived(id, state.range).albums.map(al => ({ key: `album:${al.id}`, id: al.id, url: al.sm, t1: al.name, t2: al.artists.join(', ') + (al.count > 1 ? `, ${al.count} of the top tracks` : '') }));
    const note = kind === 'albums' ? `Built from ${esc(w.poss)} top ${d.tracks.length} tracks over ${r.long}.` : `Over ${r.long}.`;
    return `<p class="list-note">${note}${prev ? ` Arrows compare with the ${rangeOf(cmp).adj} ranking.` : ''}</p>
      <ol class="rank-list">${items.map((it, i) => {
        const p = prev ? prev.get(it.id) : undefined;
        const tr = !prev ? null : p == null ? 'new' : p - i;
        return `<li><button class="rank-row" data-open="${esc(it.key)}"><span class="n${i < 3 ? ' top' : ''}">${i + 1}</span><span class="art${it.round ? ' round' : ''}">${img(it.url)}</span><span class="rt"><span class="t1">${esc(it.t1)}</span>${it.t2 ? `<span class="t2">${esc(it.t2)}</span>` : ''}</span>${trendView(tr)}</button></li>`;
      }).join('')}</ol>`;
  }

  function loginMessage(code) {
    const inviter = state.gate.invite ? firstName(state.gate.invite) : 'the person who set Rotation up';
    switch (code) {
      case null: case undefined: case '': return '';
      case 'cancelled': return 'Login was cancelled.';
      case 'not_allowlisted': return `Spotify hasn't let this account in yet. Apps like Rotation only work for accounts added in the Spotify Developer Dashboard, so ask ${inviter} to add the email of your Spotify account, then try again.`;
      case 'spotify_forbidden': return "Spotify refused the login. This usually means the Spotify account that registered Rotation doesn't have Premium right now.";
      case 'login_expired': return 'That login took too long. Try again.';
      case 'nonce_missing': return 'That login was started in a different browser or tab. Start it again here.';
      case 'not_configured': return "Rotation isn't connected to Spotify yet.";
      case 'origin_not_allowed': return "This address isn't allowed to log in to Rotation yet.";
      case 'signed_out': return 'Your session ended. Connect again to keep going.';
      case 'disconnected': return 'Spotify stopped sharing your stats with Rotation. Connect again to pick up where you left off.';
      case 'deleted': return 'Your account and stats were deleted.';
      case 'offline': return "Couldn't reach Rotation. Check your connection and try again.";
      default: return "Spotify login didn't work. Try again.";
    }
  }

  function gateView() {
    const g = state.gate;
    const cfg = g.config;
    const blocked = cfg && (!cfg.ready || cfg.origin_ok === false);
    const msg = loginMessage(g.err);
    return `<div class="gate">
      <span class="wordmark">${MARK}rotation</span>
      <div class="gate-main">
        ${g.invite ? `<p class="inviter"><span class="avatar">${avatarInner(g.invite)}</span><span><b>${esc(g.invite.name)}</b> invited you to compare your music.</span></p>` : ''}
        <h1>Your listening, ranked.</h1>
        <p class="lede">Your top artists, tracks and listening time from Spotify, what your friends are into, and how your taste compares.</p>
        ${msg ? `<p class="notice${g.err === 'deleted' ? ' calm' : ''}" role="alert">${esc(msg)}</p>` : ''}
        ${blocked && !msg ? `<p class="notice calm">${cfg.ready ? "This address isn't allowed to log in to Rotation yet." : "Rotation isn't connected to Spotify yet."}</p>` : ''}
        <button class="btn btn-green btn-wide" data-act="connect"${g.busy || blocked ? ' disabled' : ''}>${g.busy ? 'Opening Spotify…' : 'Connect with Spotify'}</button>
        <p class="fine">You'll log in on Spotify's site. Rotation can see your top items, recent plays and what's playing, and can't change anything in your Spotify account. Friends you add can see your stats.</p>
      </div>
    </div>`;
  }
  function connectingView() {
    return `<div class="gate"><span class="wordmark">${MARK}rotation</span><div class="gate-main"><h1>Connecting…</h1><p class="lede">Finishing your Spotify login.</p></div></div>`;
  }

  /* ---------- Detail sheets ---------- */
  function ranksView(sid, kind, itemId) {
    return `<div class="ranks3">${RANGES.map(r => {
      const n = indexIn(listFor(sid, kind, r.id), itemId);
      return `<div${r.id === state.range ? ' class="cur"' : ''}><span>${r.label}</span>${n ? `<strong>#${n}</strong>` : '<strong class="out">Not ranked</strong>'}</div>`;
    }).join('')}</div>`;
  }
  function rankLabel(sid) { return isMe(sid) ? '' : `<p class="s-label">${esc(who(sid).Poss)} rankings</p>`; }
  function yourRankRow(sid, kind, itemId) {
    if (isMe(sid)) return '';
    const n = indexIn(listFor(state.me.id, kind, state.range), itemId);
    return `<div><dt>Your rank, ${rangeOf(state.range).label}</dt><dd>${n ? '#' + n : `Not in your top ${kind}`}</dd></div>`;
  }
  function miniRow(t, rank) {
    return `<li><button class="rank-row mini" data-open="track:${esc(t.id)}"><span class="n${rank <= 3 ? ' top' : ''}">${rank}</span><span class="art">${img(t.album.sm)}</span><span class="rt"><span class="t1">${esc(t.name)}</span><span class="t2">${esc(names(t.artists))}</span></span></button></li>`;
  }
  const spotifyButton = url => url ? `<a class="btn btn-green btn-block" href="${esc(url)}" target="_blank" rel="noopener">Open in Spotify</a>` : '';

  function findTrack(sid, tid) {
    const ids = [sid, state.me && state.me.id].filter(Boolean);
    for (const id of ids) {
      const u = state.users[id];
      for (const r of RANGES) { const t = u && u.top && u.top[r.id] && u.top[r.id].tracks.find(x => x.id === tid); if (t) return t; }
      const rp = u && u.recent && u.recent.find(x => x.id === tid);
      if (rp) return rp;
      const hp = u && u.history && (u.history.top_tracks || []).find(x => x.track && x.track.id === tid);
      if (hp) return hp.track;
      if (state.now[id] && state.now[id].id === tid) return state.now[id];
    }
    return null;
  }
  function findArtist(sid, aid) {
    for (const id of [sid, state.me && state.me.id].filter(Boolean)) {
      const u = state.users[id];
      for (const r of RANGES) { const a = u && u.top && u.top[r.id] && u.top[r.id].artists.find(x => x.id === aid); if (a) return a; }
    }
    return null;
  }
  function findAlbum(sid, alid) {
    for (const r of [state.range, ...RANGES.map(x => x.id)]) { const al = (listFor(sid, 'albums', r) || []).find(x => x.id === alid); if (al) return al; }
    const t = ((state.users[sid] && state.users[sid].recent) || []).concat(state.now[sid] ? [state.now[sid]] : []).find(x => x.album.id === alid);
    return t ? t.album : null;
  }

  function trackSheet(sid, tid) {
    const t = findTrack(sid, tid);
    if (!t) return '';
    const albumKnown = (listFor(sid, 'albums', state.range) || []).some(a => a.id === t.album.id);
    const albumLink = albumKnown ? `<button data-open="album:${esc(t.album.id)}">${esc(t.album.name)}</button>` : esc(t.album.name);
    return `<div class="s-head"><span class="art">${img(t.album.lg || t.album.md)}</span><div><h2 class="s-title">${esc(t.name)}</h2><p class="s-sub">${esc(names(t.artists))}</p></div></div>
      ${rankLabel(sid)}${ranksView(sid, 'tracks', tid)}
      <dl class="s-dl">
        ${(() => {
          const hp = ((state.users[sid] && state.users[sid].history && state.users[sid].history.top_tracks) || []).find(x => x.track && x.track.id === tid);
          return hp ? `<div><dt>Played this week</dt><dd>${plural(hp.plays, 'time', 'times')}, ${fmtDur(hp.ms)}</dd></div>` : '';
        })()}
        ${yourRankRow(sid, 'tracks', tid)}
        ${t.album.name ? `<div><dt>${t.album.type === 'single' ? 'Single' : 'Album'}</dt><dd>${albumLink}</dd></div>` : ''}
        ${t.album.date ? `<div><dt>Released</dt><dd>${esc(year(t.album.date))}</dd></div>` : ''}
        ${t.ms ? `<div><dt>Length</dt><dd>${dur(t.ms)}${t.explicit ? ', explicit' : ''}</dd></div>` : ''}
      </dl>
      ${spotifyButton(t.url)}`;
  }
  function artistSheet(sid, aid) {
    const d = state.users[sid] && state.users[sid].top && state.users[sid].top[state.range];
    let a = findArtist(sid, aid);
    if (!a) {
      const hist = ((state.users[sid] && state.users[sid].history && state.users[sid].history.top_tracks) || []).map(x => x.track);
      const credit = [...((d && d.tracks) || []), ...((state.users[sid] && state.users[sid].recent) || []), ...hist].flatMap(t => t.artists || []).find(x => x.id === aid);
      if (!credit) return '';
      a = { id: aid, name: credit.name, genres: [], url: `https://open.spotify.com/artist/${encodeURIComponent(aid)}` };
    }
    const tracks = ((d && d.tracks) || []).map((t, i) => ({ t, i })).filter(({ t }) => t.artists.some(x => x.id === aid));
    return `<div class="s-head"><span class="art round">${img(a.lg || a.md)}</span><div><h2 class="s-title">${esc(a.name)}</h2>${a.genres.length ? `<p class="s-sub">${esc(a.genres.slice(0, 4).join(', '))}</p>` : ''}</div></div>
      ${rankLabel(sid)}${ranksView(sid, 'artists', aid)}
      ${isMe(sid) ? '' : `<dl class="s-dl">${yourRankRow(sid, 'artists', aid)}</dl>`}
      ${tracks.length ? `<h3 class="s-h3">In ${esc(who(sid).poss)} top tracks <span>over ${rangeOf(state.range).long}</span></h3><ol class="rank-list s-list">${tracks.map(({ t, i }) => miniRow(t, i + 1)).join('')}</ol>` : ''}
      ${spotifyButton(a.url)}`;
  }
  function albumSheet(sid, alid) {
    const al = findAlbum(sid, alid);
    if (!al) return '';
    const d = state.users[sid] && state.users[sid].top && state.users[sid].top[state.range];
    const tracks = ((d && d.tracks) || []).map((t, i) => ({ t, i })).filter(({ t }) => t.album.id === alid);
    return `<div class="s-head"><span class="art">${img(al.lg || al.md)}</span><div><h2 class="s-title">${esc(al.name)}</h2><p class="s-sub">${esc([al.artists.join(', '), year(al.date)].filter(Boolean).join(', '))}</p></div></div>
      ${rankLabel(sid)}${ranksView(sid, 'albums', alid)}
      ${tracks.length ? `<h3 class="s-h3">In ${esc(who(sid).poss)} top tracks <span>over ${rangeOf(state.range).long}</span></h3><ol class="rank-list s-list">${tracks.map(({ t, i }) => miniRow(t, i + 1)).join('')}</ol>` : ''}
      ${spotifyButton(al.url)}`;
  }
  function genreSheet(sid, name) {
    const d = state.users[sid] && state.users[sid].top && state.users[sid].top[state.range];
    const arts = ((d && d.artists) || []).map((a, i) => ({ a, i })).filter(({ a }) => a.genres.includes(name));
    if (!arts.length) return '';
    return `<div class="s-head solo"><h2 class="s-title">${esc(name)}</h2><p class="s-sub">${arts.length} of ${esc(who(sid).poss)} top artists over ${rangeOf(state.range).long}</p></div>
      <ol class="rank-list s-list">${arts.map(({ a, i }) => `<li><button class="rank-row mini" data-open="artist:${esc(a.id)}"><span class="n${i < 3 ? ' top' : ''}">${i + 1}</span><span class="art round">${img(a.sm)}</span><span class="rt"><span class="t1">${esc(a.name)}</span></span></button></li>`).join('')}</ol>`;
  }
  function accountSheet() {
    const me = state.me || {};
    return `<div class="s-head acct"><span class="avatar big">${avatarInner(me)}</span><div><h2 class="s-title">${esc(me.name || 'Your account')}</h2><p class="s-sub">Connected to Spotify</p></div></div>
      <div class="s-actions">
        ${me.url ? `<a class="btn btn-quiet btn-block" href="${esc(me.url)}" target="_blank" rel="noopener">Open your Spotify profile</a>` : ''}
        <button class="btn btn-quiet btn-block" data-act="refresh"${state.busy ? ' disabled' : ''}>Refresh stats</button>
        <button class="btn btn-quiet btn-block" data-open="invite:me">Invite friends</button>
        <button class="btn btn-quiet btn-block" data-act="logout">Log out</button>
        <button class="btn btn-danger btn-block" data-open="delete:me">Delete account</button>
      </div>
      <p class="fine">Rankings are Spotify's own top items for each period. Listening time and play counts come from the plays Rotation saves every 20 minutes, starting from when you joined, and minutes are estimates. You can remove Rotation's access any time in your <a href="https://www.spotify.com/account/apps/" target="_blank" rel="noopener">Spotify account settings</a>.</p>`;
  }
  function inviteSheet() {
    const link = `${appUrl()}?invite=${encodeURIComponent((state.me && state.me.invite_code) || '')}`;
    return `<div class="s-head solo"><h2 class="s-title">Invite friends</h2><p class="s-sub">Send this link. Once they connect Spotify, you'll see each other's stats.</p></div>
      <div class="code"><code id="invite-link">${esc(link)}</code><button class="copy" data-act="copy">Copy</button></div>
      ${navigator.share ? '<div class="s-actions"><button class="btn btn-green btn-block" data-act="share">Share link</button></div>' : ''}
      <p class="fine">Spotify limits apps like this to 5 accounts. Before a friend can log in, whoever set up Rotation has to add the email of their Spotify account in the Spotify Developer Dashboard, under User Management.</p>
      <p class="fine">Friends can see your top artists, tracks, recent plays and what you're playing.</p>`;
  }
  function deleteSheet() {
    return `<div class="s-head solo"><h2 class="s-title">Delete your account?</h2><p class="s-sub">This removes your stats, friends and Spotify connection from Rotation. Your Spotify account isn't affected.</p></div>
      <div class="s-actions"><button class="btn btn-danger btn-block" data-act="delete"${state.busy ? ' disabled' : ''}>Delete account</button><button class="btn btn-quiet btn-block" data-act="close">Cancel</button></div>`;
  }
  function removeSheet(id) {
    const f = friendOf(id);
    if (!f) return '';
    const n = firstName(f);
    return `<div class="s-head solo"><h2 class="s-title">Remove ${esc(n)}?</h2><p class="s-sub">You'll stop seeing each other's stats. You can add each other again with an invite link.</p></div>
      <div class="s-actions"><button class="btn btn-danger btn-block" data-act="remove" data-id="${esc(id)}"${state.busy ? ' disabled' : ''}>Remove</button><button class="btn btn-quiet btn-block" data-act="close">Cancel</button></div>`;
  }
  function sheetContent(key) {
    const i = key.indexOf(':');
    const kind = key.slice(0, i), id = key.slice(i + 1);
    const sid = subjectId();
    switch (kind) {
      case 'account': return accountSheet();
      case 'invite': return inviteSheet();
      case 'delete': return deleteSheet();
      case 'remove': return removeSheet(id);
      case 'track': return trackSheet(sid, id);
      case 'artist': return artistSheet(sid, id);
      case 'album': return albumSheet(sid, id);
      case 'genre': return genreSheet(sid, id);
      default: return '';
    }
  }

  /* ---------- Rendering ---------- */
  function render() {
    document.body.classList.toggle('loading', state.screen === 'connecting' || !!(state.screen === 'app' && state.users[subjectId()] && state.users[subjectId()].loading));
    if (state.screen === 'gate') app.innerHTML = gateView();
    else if (state.screen === 'connecting' || state.screen === 'boot') app.innerHTML = state.screen === 'boot' ? '' : connectingView();
    else app.innerHTML = pageView();
    syncBar();
    applyTint();
  }
  function renderSheet() {
    const html = state.screen === 'app' && state.sheet ? sheetContent(state.sheet) : '';
    if (!html) {
      sheetRoot.innerHTML = '';
      document.body.classList.remove('locked');
      return;
    }
    const keepScroll = sheetRoot.querySelector('.sheet');
    const top = keepScroll && keepScroll.dataset.key === state.sheet ? keepScroll.scrollTop : 0;
    sheetRoot.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" tabindex="-1" data-key="${esc(state.sheet)}"><div class="grab" aria-hidden="true"></div><button class="x" data-act="close" aria-label="Close">${CROSS}</button>${html}</div></div>`;
    document.body.classList.add('locked');
    const el = sheetRoot.querySelector('.sheet');
    el.scrollTop = top;
    if (!top) el.focus({ preventScroll: true });
  }
  function syncBar() {
    const b = document.getElementById('bar');
    if (b) b.classList.toggle('solid', window.scrollY > 4);
  }
  function updateLive() {
    const ns = document.getElementById('now-slot');
    if (ns) ns.innerHTML = nowView(subjectId());
    const fs = document.getElementById('friends-slot');
    if (fs) {
      const rail = fs.querySelector('.friends');
      const x = rail ? rail.scrollLeft : 0;
      fs.innerHTML = friendsView();
      const again = fs.querySelector('.friends');
      if (again) again.scrollLeft = x;
    }
  }
  let toastTimer = 0;
  function toast(msg) {
    toastRoot.innerHTML = `<div class="toast">${esc(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastRoot.innerHTML = ''; }, 3200);
  }

  /* ---------- Navigation (works with the back gesture) ---------- */
  const viewKey = () => `${state.friend || ''}|${state.list || ''}`;
  function applyNav(s, scrollTop) {
    const before = viewKey();
    state.friend = s.friend && friendOf(s.friend) ? s.friend : null;
    state.list = s.list || null;
    state.sheet = s.sheet || null;
    if (viewKey() !== before) {
      render();
      window.scrollTo(0, scrollTop ? 0 : (state.scroll[viewKey()] || 0));
      if (state.friend) ensureUser(state.friend);
    }
    renderSheet();
  }
  function go(next) {
    state.scroll[viewKey()] = window.scrollY;
    history.pushState(next, '');
    applyNav(next, true);
  }
  const openFriend = id => go({ friend: id });
  const openList = kind => go({ friend: state.friend, list: kind });
  function openSheet(key) {
    const next = { friend: state.friend, list: state.list, sheet: key };
    if (state.sheet) history.replaceState(next, ''); else history.pushState(next, '');
    state.sheet = key;
    renderSheet();
  }
  function closeSheet() {
    if (history.state && history.state.sheet) history.back();
    else { state.sheet = null; renderSheet(); }
  }
  window.addEventListener('popstate', e => {
    if (state.screen !== 'app') return;
    applyNav(e.state || {}, false);
  });

  /* ---------- Login ---------- */
  async function connect() {
    state.gate.busy = true;
    if (state.screen === 'gate') render();
    try {
      const nonce = randomString(40);
      local.set('nonce', nonce);
      const r = await api('/auth/start', { method: 'POST', body: { return_to: appUrl(), nonce } });
      location.assign(r.url);
    } catch (e) {
      state.gate.busy = false;
      if (state.screen !== 'gate') { toast(loginMessage(e.code || 'error')); return; }
      state.gate.err = e.code || 'error';
      render();
    }
  }
  function showGate(code) {
    clearTimeout(nowTimer);
    state.screen = 'gate';
    state.gate.err = code || null;
    state.gate.busy = false;
    state.sheet = null;
    renderSheet();
    render();
    api('/config').then(c => { state.gate.config = c; if (state.screen === 'gate') render(); }).catch(() => {});
    const invite = local.get('invite');
    if (invite && !state.gate.invite) {
      api('/invite/' + encodeURIComponent(invite)).then(p => { state.gate.invite = p; if (state.screen === 'gate') render(); }).catch(() => {});
    }
  }
  function forget() {
    const keep = local.get('range');
    local.clear();
    if (keep) local.set('range', keep);
    memo.clear();
    Object.assign(state, { me: null, users: {}, now: {}, friend: null, list: null, sheet: null, fatal: null, scroll: {} });
    history.replaceState({}, '', appUrl());
  }
  function signedOut(code) { forget(); showGate(code); }

  /* ---------- Loading data ---------- */
  function setMe(me) {
    state.me = me;
    local.set('me', me);
  }
  function hydrate(id) {
    const u = state.users[id] || (state.users[id] = {});
    if (!u.top) { const c = local.get('u.' + id); if (c && c.top) Object.assign(u, c); }
    return u;
  }
  function explain(e, id) {
    const mine = isMe(id);
    const name = who(id).name;
    switch (e.code) {
      case 'disconnected':
        return mine
          ? { title: 'Spotify disconnected', body: loginMessage('disconnected'), action: 'reconnect' }
          : { title: `${name}'s Spotify isn't connected`, body: `${name} needs to open Rotation and connect Spotify again before you can see new stats.`, back: true };
      case 'not_allowlisted':
        return mine
          ? { title: "Spotify isn't letting Rotation in", body: 'Your account needs to be on the app\'s user list in the Spotify Developer Dashboard.' }
          : { title: `Spotify isn't sharing ${name}'s stats`, body: `${name}'s account may have been removed from the app's user list in the Spotify Developer Dashboard.`, back: true };
      case 'spotify_forbidden': return { title: 'Spotify refused the request', body: "This usually means the Spotify account that registered Rotation doesn't have Premium right now." };
      case 'not_friends': return { title: 'Not friends anymore', body: `You and ${name} aren't friends on Rotation right now.`, back: true };
      case 'quota': case 'rate_limited': return { title: 'Spotify needs a break', body: 'Rotation asked Spotify for too much at once. Try again in a few minutes.' };
      case 'offline': return { title: "Couldn't reach Rotation", body: 'Check your connection and try again.' };
      default: return { title: 'Something went wrong', body: e.message || 'Try again in a moment.' };
    }
  }
  function staleNote(u, code, id) {
    const when = u.fetchedAt ? `${dayLabel(u.fetchedAt) === 'Today' ? 'today' : fmtDay.format(new Date(u.fetchedAt))} at ${fmtTime.format(new Date(u.fetchedAt))}` : 'earlier';
    const why = code === 'disconnected' ? (isMe(id) ? ' Spotify disconnected, so connect again from the account menu to update them.' : ` ${who(id).name} needs to connect Spotify again to update them.`) : ' Spotify is busy, so they will update later.';
    return `Showing stats from ${when}.${why}`;
  }
  async function loadUser(id, fresh = false) {
    const u = hydrate(id);
    u.loading = true;
    u.error = null;
    if (subjectId() === id) render();
    try {
      const r = await api(`/stats?user=${encodeURIComponent(id)}&tz=${encodeURIComponent(TZ)}${fresh ? '&fresh=1' : ''}`);
